name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  # Open/refresh the version PR from changesets. Runs freely (no env gate, no publish).
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/verdaccio'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies with a custom registry
        uses: ./.github/actions/install-app
      - name: crowdin download
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm crowdin:download
      - name: build
        run: pnpm build
      - name: create versions
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: pnpm ci:version
          commit: 'chore: update versions'
          title: 'chore: update versions'
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_RELEASE_TOKEN }}

  # Publish to npm once the version PR is merged (no changesets left).
  # Gated by the `npm` environment, which requires manual approval.
  publish:
    needs: version
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/verdaccio' && needs.version.result == 'success' && needs.version.outputs.hasChangesets == 'false'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies with a custom registry
        uses: ./.github/actions/install-app
      - name: crowdin download
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm crowdin:download
      - name: build
        run: pnpm build
      - name: publish
        id: npm-publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: pnpm ci:publish
          createGithubReleases: false
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          # Changesets invokes pnpm publish for each changed workspace package.
          # Keep provenance in the publish process so every package gets an
          # npm-hosted provenance attestation from this protected OIDC job.
          PNPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Verify provenance for published packages
        env:
          PUBLISHED_PACKAGES: ${{ steps.npm-publish.outputs.publishedPackages }}
        run: bash scripts/verify-npm-provenance.sh
