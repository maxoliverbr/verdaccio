name: Docker build test

on:
  # The CI workflow builds and exercises this image on every PR and merge queue run.
  # Keep this as an explicit diagnostic while required-check settings are audited.
  workflow_dispatch:

concurrency:
  group: docker-build-test-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: verdaccio/verdaccio:manual

      - name: Exercise built image
        run: bash scripts/test-docker-image.sh verdaccio/verdaccio:manual
